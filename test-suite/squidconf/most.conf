# Includes most non-conflicting non-legacy cf.data.pre directives that are not subject to IFDEF controls.

acl localnet src 0.0.0.1-0.255.255.255	# RFC 1122 "this" network (LAN)
acl localnet src 10.0.0.0/8		# RFC 1918 local private network (LAN)
acl localnet src 100.64.0.0/10		# RFC 6598 shared address space (CGN)
acl localnet src 169.254.0.0/16 	# RFC 3927 link-local (directly plugged) machines
acl localnet src 172.16.0.0/12		# RFC 1918 local private network (LAN)
acl localnet src 192.168.0.0/16		# RFC 1918 local private network (LAN)
acl localnet src fc00::/7       	# RFC 4193 local private network range
acl localnet src fe80::/10      	# RFC 4291 link-local (directly plugged) machines

# Only allow cachemgr access from localhost
http_access allow localhost manager
http_access deny all

http_port 3128
http_port 3129

ftp_port 3130
ftp_port 3131

refresh_pattern ^ftp:		1440	20%	10080
refresh_pattern -i (/cgi-bin/|\?) 0	0%	0
refresh_pattern .		0	20%	4320

# These settings are Squid defaults.
workers 1
shared_memory_locking off
hopeless_kid_revival_delay 1 hour
acl ssl::certHasExpired ssl_error X509_V_ERR_CERT_HAS_EXPIRED
acl ssl::certNotYetValid ssl_error X509_V_ERR_CERT_NOT_YET_VALID
acl ssl::certDomainMismatch ssl_error SQUID_X509_V_ERR_DOMAIN_MISMATCH
acl ssl::certUntrusted ssl_error X509_V_ERR_INVALID_CA X509_V_ERR_SELF_SIGNED_CERT_IN_CHAIN X509_V_ERR_UNABLE_TO_VERIFY_LEAF_SIGNATURE X509_V_ERR_UNABLE_TO_GET_ISSUER_CERT X509_V_ERR_UNABLE_TO_GET_ISSUER_CERT_LOCALLY X509_V_ERR_CERT_UNTRUSTED
acl ssl::certSelfSigned ssl_error X509_V_ERR_DEPTH_ZERO_SELF_SIGNED_CERT
acl all src all
acl localhost1 src 127.0.0.1/32 ::1
acl to_localhost1 dst 127.0.0.0/8 0.0.0.0/32 ::1/128 ::/128
acl to_linklocal1 dst 169.254.0.0/16 fe80::/10
acl CONNECT method CONNECT
host_verify_strict off
client_dst_passthru on
tls_outgoing_options min-version=1.0
dead_peer_timeout 10 seconds
forward_max_tries 25
cache_mem 256 MB
maximum_object_size_in_memory 512 KB
memory_cache_mode always
memory_replacement_policy lru
cache_replacement_policy lru
minimum_object_size 0 KB
maximum_object_size 4 MB
store_dir_select_algorithm least-load
paranoid_hit_validation 0
max_open_disk_fds 0
cache_swap_low 90
cache_swap_high 95
logfile_rotate 10
log_mime_hdrs off
client_netmask no_addr
strip_query_terms on
buffered_logs off
debug_options ALL,1
ftp_user Squid@
ftp_passive on
ftp_epsv_all off
ftp_eprt on
ftp_sanitycheck on
ftp_telnet_protocol on
url_rewrite_children 20 startup=0 idle=1 concurrency=0
url_rewrite_host_header on
url_rewrite_bypass off
url_rewrite_extras "%>a/%>A %un %>rm myip=%la myport=%lp"
store_id_extras "%>a/%>A %un %>rm myip=%la myport=%lp"
store_id_children 20 startup=0 idle=1 concurrency=0
store_id_bypass on
max_stale 1 week
quick_abort_min 16 KB
quick_abort_max 16 KB
quick_abort_pct 95
read_ahead_gap 16 KB
positive_dns_ttl 6 hours
negative_dns_ttl 1 minutes
minimum_expiry_time 60 seconds
store_avg_object_size 13 KB
store_objects_per_bucket 20
request_header_max_size 64 KB
reply_header_max_size 64 KB
request_body_max_size 0 KB
client_request_buffer_max_size 512 KB
vary_ignore_expire off
relaxed_header_parser on
collapsed_forwarding off
shared_transient_entries_limit 16384
forward_timeout 4 minutes
connect_timeout 1 minute
peer_connect_timeout 30 seconds
read_timeout 15 minutes
write_timeout 15 minutes
request_timeout 5 minutes
request_start_timeout 5 minutes
client_idle_pconn_timeout 2 minutes
ftp_client_idle_timeout 30 minutes
client_lifetime 1 day
pconn_lifetime 0 seconds
half_closed_clients off
server_idle_pconn_timeout 1 minute
shutdown_lifetime 30 seconds
cache_mgr webmaster
mail_program mail
cache_effective_user nobody
httpd_suppress_version_string off
umask 027
http_accel_surrogate_remote off
client_persistent_connections on
server_persistent_connections on
persistent_connection_after_error on
detect_broken_pconn off
icp_port 3140 
log_icp_queries on
udp_incoming_address any_addr
udp_outgoing_address no_addr
icp_hit_stale off
minimum_direct_hops 4
minimum_direct_rtt 400
netdb_low 900
netdb_high 1000
netdb_ping_period 5 minutes
query_icmp off
test_reachability off
icp_query_timeout 0
maximum_icp_query_timeout 2000
minimum_icp_query_timeout 5
background_ping_rate 10 seconds
mcast_icp_query_timeout 2000
global_internal_static on
short_icon_urls on
email_err_data off
nonhierarchical_direct on
prefer_direct off
cache_miss_revalidate on
incoming_udp_average 6
incoming_tcp_average 4
incoming_dns_average 4
min_udp_poll_cnt 8
min_dns_poll_cnt 8
min_tcp_poll_cnt 8
client_ip_max_connections -1
tcp_recv_bufsize 0 bytes
check_hostnames off
allow_underscore on
dns_retransmit_interval 5 seconds
dns_timeout 30 seconds
dns_defnames off
dns_multicast_local off
hosts_file /etc/hosts
ignore_unknown_nameservers on
ipcache_size 1024
ipcache_low 90
ipcache_high 95
fqdncache_size 1024
memory_pools on
memory_pools_limit 5 MB
forwarded_for on
client_db on
refresh_all_ims off
connect_retries 0
retry_on_error off
as_whois_server whois.ra.net
offline_mode off
uri_whitespace strip
pipeline_prefetch 0
high_response_time_warning 0
high_page_fault_warning 0
sleep_after_fork 0
max_filedescriptors 0
happy_eyeballs_connect_timeout 250
happy_eyeballs_connect_gap -1
happy_eyeballs_connect_limit -1
sslproxy_cert_sign signUntrusted ssl::certUntrusted
sslproxy_cert_sign signSelf ssl::certSelfSigned
sslproxy_cert_sign signTrusted all

# Non-default settings that can be listed by
# grep 'No default' cf_parser.cci
# These settings were configured manually with stub values.

proxy_protocol_access allow localhost localnet
proxy_protocol_access allow all
proxy_protocol_access deny all

adapted_http_access allow manager 
adapted_http_access deny all

http_reply_access allow manager 
http_reply_access deny all

icp_access allow localhost localnet
icp_access deny all

miss_access allow localhost localnet
miss_access deny all

cache_peer localhost sibling 3138 3141 default name=SomePeer proxy-only 
cache_peer_access SomePeer allow localhost localnet
cache_peer_access SomePeer deny all

cache_peer foo.example.com parent 3128 3130
neighbor_type_domain foo.example.com sibling .au .de

url_rewrite_access allow localhost localnet
url_rewrite_access deny all

store_id_access allow localhost localnet
store_id_access deny all

collapsed_forwarding_access allow localhost localnet
collapsed_forwarding_access deny all

snmp_access allow localhost localnet
snmp_access deny all

cpu_affinity_map process_numbers=1,2,3,4 cores=1,3,5,7

external_acl_type custom_acl ttl=100 %SRC /bin/false

spoof_client_ip allow localhost

reply_body_max_size 10 MB

on_unsupported_protocol tunnel !localhost
on_unsupported_protocol tunnel localnet

tcp_outgoing_tos 0x00 localnet
tcp_outgoing_tos 0x20 localhost

clientside_tos 0x00 localnet
clientside_tos 0x20 localhost

memory_cache_shared on

logformat squid %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt

stats_collection allow localhost
stats_collection deny localnet

access_log /dev/null localhost 
access_log /dev/null localnet 

cache_log /dev/null localhost
cache_log /dev/null localnet

cache_store_log stdio:/dev/null
cache_store_log /dev/null

cache_swap_state /dev/null

cache_log_message ids=7-8 limit=5
cache_log_message ids=9-10 limit=5
coredump_dir /tmp

ftp_epsv allow localhost
ftp_epsv deny all

diskd_program /bin/true
store_id_program /bin/true

url_rewrite_timeout 10 seconds on_timeout=fail
url_rewrite_timeout 5 seconds on_timeout=bypass

cache allow localhost
cache deny all

send_hit allow localhost
send_hit deny all

store_miss allow localhost
store_miss deny all

range_offset_limit 1 MB localhost
range_offset_limit 10 MB all

request_header_add X-Client-CA "CA=%ssl::>cert_issuer" localhost
request_header_add Y-Client-CA "CA=%ssl::>cert_issuer" all

reply_header_add X-Client-CA "CA=%ssl::>cert_issuer" localhost
reply_header_add Y-Client-CA "CA=%ssl::>cert_issuer" all

note env sandbox localhost
note env prod all

mail_from foo@example.com

cache_effective_group nogroup

visible_hostname localhost 
unique_hostname localhost 

hostname_aliases foo1 bar1

httpd_accel_surrogate_id foo_surrogate

mcast_groups 127.0.0.1

error_directory /tmp

err_html_text <p>Error</p>

deny_info http://example.com localhost
deny_info TCP_RESET all

always_direct allow localhost
always_direct deny all

never_direct allow localhost
never_direct deny all

accept_filter data

dns_packet_max 4096 bytes

dns_nameservers 8.8.8.8 1.1.1.1 

cachemgr_passwd none all

force_request_body_continuation allow localhost
force_request_body_continuation deny all

http_upgrade_request_protocols Foo deny all
http_upgrade_request_protocols OTHER allow all

server_pconn_for_nonretriable allow localhost
server_pconn_for_nonretriable deny all

logfile_daemon /bin/true

